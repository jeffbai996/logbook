name: release

# Build six archives for a version tag, then publish them in one release job.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed by softprops/action-gh-release to attach files

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Verify tag and package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
          cargo package --locked

  build:
    name: build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,    archive: tar.gz }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,   archive: tar.gz, musl: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,   archive: tar.gz, cross: true }
          - { os: macos-latest,   target: x86_64-apple-darwin,         archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,        archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,      archive: zip   }

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust + target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Install cross-compiler (aarch64 linux only)
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools (musl target only)
        if: matrix.musl == true
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging/docs/screenshots
          cp README.md LICENSE CHANGELOG.md CONTRIBUTING.md staging/
          cp docs/screenshots/*.svg staging/docs/screenshots/
          VERSION="${GITHUB_REF_NAME#v}"
          STEM="logbook-${VERSION}-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/logbook.exe" "staging/"
            (cd staging && 7z a "../${STEM}.zip" .)
            echo "ASSET=${STEM}.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/logbook" "staging/"
            tar -czf "${STEM}.tar.gz" -C staging .
            echo "ASSET=${STEM}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: logbook-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: logbook-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum logbook-* > SHA256SUMS
      - name: Publish GitHub Release once
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
