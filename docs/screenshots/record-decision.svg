<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title description">
  <title id="title">Recording a decision with logbook</title>
  <desc id="description">A terminal showing logbook add recording why a Markdown decision log was chosen, along with a rejected alternative, accepted risk, and tag.</desc>
  <rect x="16" y="16" width="968" height="498" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M32 16h936a16 16 0 0 1 16 16v52H16V32a16 16 0 0 1 16-16z" fill="#161b22"/>
  <line x1="16" y1="84" x2="984" y2="84" stroke="#30363d" stroke-width="2"/>
  <circle cx="52" cy="50" r="8" fill="#ff5f56"/>
  <circle cx="78" cy="50" r="8" fill="#ffbd2e"/>
  <circle cx="104" cy="50" r="8" fill="#27c93f"/>
  <text x="500" y="57" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18">logbook · record a decision</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18">
    <text x="52" y="122" fill="#3fb950" font-weight="700">$</text>
    <text x="78" y="122" fill="#f0f6fc">logbook add &quot;keep decisions in plain Markdown&quot; \</text>
    <text x="78" y="152" fill="#c9d1d9">--why &quot;Git already handles review, history, and sync.&quot; \</text>
    <text x="78" y="182" fill="#c9d1d9">--rejected &quot;A database adds lifecycle work.&quot; \</text>
    <text x="78" y="212" fill="#c9d1d9">--risk &quot;Large logs still need bounded retrieval.&quot; \</text>
    <text x="78" y="242" fill="#c9d1d9">--tag architecture --date 2026-08-30 --print</text>

    <text x="52" y="286" fill="#3fb950">added:</text>
    <text x="124" y="286" fill="#c9d1d9">2026-08-30 — keep decisions in plain Markdown</text>
    <text x="52" y="316" fill="#8b949e">---</text>
    <text x="52" y="350" fill="#58a6ff" font-weight="700">## 2026-08-30 — keep decisions in plain Markdown</text>
    <text x="52" y="382" fill="#f0f6fc" font-weight="700">**why:**<tspan fill="#c9d1d9" font-weight="400"> Git already handles review, history, and sync.</tspan></text>
    <text x="52" y="414" fill="#f0f6fc" font-weight="700">**rejected:**<tspan fill="#c9d1d9" font-weight="400"> A database adds lifecycle work.</tspan></text>
    <text x="52" y="446" fill="#f0f6fc" font-weight="700">**risk:**<tspan fill="#c9d1d9" font-weight="400"> Large logs still need bounded retrieval.</tspan></text>
    <text x="52" y="478" fill="#f0f6fc" font-weight="700">**tags:**<tspan fill="#c9d1d9" font-weight="400"> architecture</tspan></text>
  </g>
</svg>
