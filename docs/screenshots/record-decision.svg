<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title description">
  <title id="title">One command appends one Markdown decision</title>
  <desc id="description">A compact terminal transcript showing logbook add followed by the readable Markdown entry appended to logbook.md.</desc>
  <rect x="8" y="8" width="704" height="484" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M28 8h664a20 20 0 0 1 20 20v44H8V28A20 20 0 0 1 28 8z" fill="#161b22"/>
  <line x1="8" y1="72" x2="712" y2="72" stroke="#30363d" stroke-width="2"/>
  <circle cx="38" cy="40" r="7" fill="#ff5f56"/>
  <circle cx="61" cy="40" r="7" fill="#ffbd2e"/>
  <circle cx="84" cy="40" r="7" fill="#27c93f"/>
  <text x="360" y="46" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">one command → one append</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17">
    <text x="34" y="108" fill="#3fb950" font-weight="700">$</text>
    <text x="58" y="108" fill="#f0f6fc">logbook add &quot;store tokens in the OS keychain&quot; \</text>
    <text x="58" y="136" fill="#c9d1d9">--why &quot;The OS provides encryption and access control.&quot; \</text>
    <text x="58" y="164" fill="#c9d1d9">--rejected &quot;An app-specific file needs another key.&quot; \</text>
    <text x="58" y="192" fill="#c9d1d9">--risk &quot;Headless systems need another strategy.&quot; \</text>
    <text x="58" y="220" fill="#c9d1d9">--tag security --stage --print</text>

    <rect x="28" y="246" width="664" height="218" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="48" y="278" fill="#8b949e" font-size="14" font-weight="700" letter-spacing="1.5">APPENDED TO LOGBOOK.MD</text>
    <text x="48" y="316" fill="#58a6ff" font-weight="700">## 2026-08-30 — store tokens in the OS keychain</text>
    <text x="48" y="350" fill="#f0f6fc" font-weight="700">**why:**<tspan fill="#c9d1d9" font-weight="400"> The OS provides encryption and access control.</tspan></text>
    <text x="48" y="380" fill="#f0f6fc" font-weight="700">**rejected:**<tspan fill="#c9d1d9" font-weight="400"> An app-specific file needs another key.</tspan></text>
    <text x="48" y="410" fill="#f0f6fc" font-weight="700">**risk:**<tspan fill="#c9d1d9" font-weight="400"> Headless systems need another strategy.</tspan></text>
    <text x="48" y="440" fill="#f0f6fc" font-weight="700">**tags:**<tspan fill="#c9d1d9" font-weight="400"> security</tspan></text>
  </g>
</svg>
