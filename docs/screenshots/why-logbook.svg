<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="title description">
  <title id="title">Code, Git, and logbook answer different questions</title>
  <desc id="description">Code explains what a system does, Git explains what changed, and logbook preserves why a decision was made.</desc>
  <rect x="8" y="8" width="704" height="336" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="36" y="48" fill="#8b949e" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="2">THREE ARTIFACTS · THREE QUESTIONS</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="28" y="70" width="664" height="72" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="44" y="84" width="116" height="44" rx="22" fill="#21262d"/>
    <text x="102" y="112" text-anchor="middle" fill="#c9d1d9" font-size="17" font-weight="700">CODE</text>
    <text x="188" y="113" fill="#f0f6fc" font-size="23">What does the system do?</text>

    <rect x="28" y="150" width="664" height="72" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="44" y="164" width="116" height="44" rx="22" fill="#21262d"/>
    <text x="102" y="192" text-anchor="middle" fill="#c9d1d9" font-size="17" font-weight="700">GIT</text>
    <text x="188" y="193" fill="#f0f6fc" font-size="23">What changed?</text>

    <rect x="28" y="230" width="664" height="94" rx="12" fill="#122117" stroke="#3fb950" stroke-width="2"/>
    <rect x="44" y="255" width="116" height="44" rx="22" fill="#1f6f3f"/>
    <text x="102" y="283" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">LOGBOOK</text>
    <text x="188" y="272" fill="#f0f6fc" font-size="23" font-weight="700">Why did we choose this?</text>
    <text x="188" y="299" fill="#8b949e" font-size="16">The part a diff cannot remember for you.</text>
  </g>
</svg>
