<svg xmlns="http://www.w3.org/2000/svg" width="720" height="414" viewBox="0 0 720 414" role="img" aria-labelledby="title description" xml:space="preserve">
  <title id="title">Search returns one current decision with its reasoning</title>
  <desc id="description">Actual logbook terminal output for a search filtered to active storage decisions, showing the current Postgres decision, its reason, predecessor, risk, and tag.</desc>
  <rect x="8" y="8" width="704" height="398" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M28 8h664a20 20 0 0 1 20 20v44H8V28A20 20 0 0 1 28 8z" fill="#161b22"/>
  <line x1="8" y1="72" x2="712" y2="72" stroke="#30363d" stroke-width="2"/>
  <circle cx="38" cy="40" r="7" fill="#ff5f56"/>
  <circle cx="61" cy="40" r="7" fill="#ffbd2e"/>
  <circle cx="84" cy="40" r="7" fill="#27c93f"/>
  <text x="360" y="46" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">find one current constraint</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="34" y="111" fill="#3fb950" font-size="17" font-weight="700">$</text>
    <text x="58" y="111" fill="#f0f6fc" font-size="17">logbook search contention --active --tag storage --limit 3</text>

    <rect x="28" y="136" width="664" height="234" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="48" y="166" fill="#8b949e" font-size="13" font-weight="700" letter-spacing="1.5">ACTUAL OUTPUT</text>
    <text x="48" y="204" fill="#58a6ff" font-size="18" font-weight="700">## 2026-08-30 — move state to Postgres</text>
    <text x="48" y="238" fill="#f0f6fc" font-size="16" font-weight="700">**why:**<tspan fill="#c9d1d9" font-weight="400"> Write contention is now measurable.</tspan></text>
    <text x="48" y="270" fill="#f0f6fc" font-size="16" font-weight="700">**supersedes:**<tspan fill="#c9d1d9" font-weight="400"> 2026-08-01 — use SQLite for local state</tspan></text>
    <text x="48" y="302" fill="#f0f6fc" font-size="16" font-weight="700">**risk:**<tspan fill="#c9d1d9" font-weight="400"> Adds an operational dependency.</tspan></text>
    <text x="48" y="334" fill="#f0f6fc" font-size="16" font-weight="700">**tags:**<tspan fill="#c9d1d9" font-weight="400"> storage</tspan></text>
  </g>
</svg>
