[package]
name = "logbook"
version = "0.5.1"
edition = "2021"
rust-version = "1.85"
authors = ["Jeff Bai"]
description = "A tiny per-repo decision-log CLI backed by one append-only logbook.md"
license = "MIT"
repository = "https://github.com/jeffbai996/logbook"
homepage = "https://github.com/jeffbai996/logbook"
documentation = "https://docs.rs/logbook"
readme = "README.md"
keywords = ["cli", "decision-log", "markdown", "adr", "documentation"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "docs/screenshots/*.svg",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
proptest = "1.5"

[profile.release]
strip = true
lto = true
opt-level = "z"
